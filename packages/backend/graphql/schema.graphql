# ===================
#      SCALARS
# ===================
scalar AWSDate

scalar AWSDateTime

scalar AWSEmail

scalar AWSJSON

scalar AWSURL

# For flexible preferences or potentially the DailyPlan if needed, though Map is preferred
# ===================
#        ENUMS
# ===================
enum AllergenEnum {
  GLUTEN_CEREALS
  CRUSTACEANS
  EGGS
  FISH
  PEANUTS
  SOYBEANS
  MILK
  NUTS
  CELERY
  MUSTARD
  SESAME_SEEDS
  SULPHITES
  LUPIN
  MOLLUSCS
}

# ===================
#     INPUT TYPES
# ===================
input AssignNutritionistInput {
  mealPlanId: ID!
  nutritionistId: ID!
}

# ===================
#     OBJECT TYPES
# ===================

type ChatResponse {
  recipientId: ID!
  message: ChatMessage
}

type ChatMessagesResponse {
  messages: [ChatMessage!]!
  oldestTimestamp: String # Use this for next beforeTimestamp
  hasMore: Boolean!
  count: Int!
}

type ChatMessage @model {
  chatId: ID!
  messageId: ID!
  senderId: ID!
  senderType: SenderType!
  messageContent: String!
  sentAt: AWSDateTime!
  # Add these for better UX in the subscription
  senderName: String
  # Populated from Cognito
  recipientId: ID!
}

type ChatMessageConnection {
  items: [ChatMessage!]!
  nextToken: String
}

type ChatMetadata @model {
  chatId: ID!
  userId: ID!
  mealPlanId: ID!
  nutritionistId: ID!
  planName: String
  # Denormalized for easier display in chat lists
  userGivenName: String
  # Denormalized for display
  nutritionistGivenName: String
  # Denormalized for display
  lastMessageTimestamp: AWSDateTime
  lastMessageSnippet: String
  userUnreadCount: Int
  nutritionistUnreadCount: Int
  createdAt: AWSDateTime
}

type ChatMetadataConnection {
  items: [ChatMetadata!]!
  nextToken: String
}

input CreateMealPlanInput {
  planName: String!
  startDate: AWSDate!
  endDate: AWSDate!
  status: PlanStatus
  dailyPlan: DailyPlanDataInput!
}

type DailyPlanData {
  monday: [Meal!]
  tuesday: [Meal!]
  wednesday: [Meal!]
  thursday: [Meal!]
  friday: [Meal!]
  saturday: [Meal!]
  sunday: [Meal!]
}

input DailyPlanDataInput {
  monday: [MealInput!]
  tuesday: [MealInput!]
  wednesday: [MealInput!]
  thursday: [MealInput!]
  friday: [MealInput!]
  saturday: [MealInput!]
  sunday: [MealInput!]
}

enum ExerciseFrequency {
  NOT_SPECIFIED
  NONE
  ONCE_A_WEEK
  TWICE_A_WEEK
  THREE_TIMES_A_WEEK
  FOUR_TIMES_A_WEEK
  FIVE_TIMES_A_WEEK
  SIX_TIMES_A_WEEK
  EVERY_DAY
}

type Ingredient {
  name: String!
  amount: Float!
  unit: String
  # e.g., "g", "ml", "cup". Ensure this is stored in DynamoDB.
  macros: Macros!
}

input IngredientInput {
  name: String!
  amount: Float!
  unit: String
  macros: MacrosInput!
}

input ListNutritionistsFilter {
  isAvailable: Boolean
}

type Macros {
  proteins: Float!
  carbohydrates: Float!
  fats: Float!
  calories: Float!
}

input MacrosInput {
  proteins: Float!
  carbohydrates: Float!
  fats: Float!
  calories: Float!
}

input MarkMealCompletedInput {
  mealPlanId: ID!
  mealName: MealNameEnum!
  date: AWSDate
}

type Meal {
  name: MealNameEnum!
  # Using the fixed enum based on i18n requirement
  recipeName: String
  # Optional: A more descriptive name for the specific recipe used
  ingredients: [Ingredient!]!
  totalMacros: Macros!
  recipe: String
}

input MealInput {
  name: MealNameEnum!
  recipeName: String
  ingredients: [IngredientInput!]!
  totalMacros: MacrosInput!
  recipe: String
}

enum MealNameEnum {
  BREAKFAST
  SNACK_MORNING
  LUNCH
  SNACK_AFTERNOON
  DINNER
  SNACK_EVENING
}

type MealPlan @model {
  mealPlanId: ID!
  # Extracted from SK
  userId: ID!
  # From PK
  planName: String
  generatedAt: AWSDateTime
  status: PlanStatus
  validationStatus: MealPlanValidationStatus
  assignedNutritionistId: ID
  chatId: ID
  dailyPlan: DailyPlanData
}

#  Pagination Helper Types
type MealPlanConnection {
  items: [MealPlan!]!
  nextToken: String
  activeMealPlan: MealPlan
}

type MealPlanGenerationStatus {
  status: MealPlanGenerationStatusValue!
  mealPlanId: ID
  # Populated if status is COMPLETED
  message: String
}

enum MealPlanGenerationStatusValue {
  PENDING
  IN_PROGRESS
  COMPLETED
  FAILED
}

type MealPlanList {
  items: [MealPlan!]!
  nextToken: String
  activeMealPlan: ID
}

type MealPlanResponse @aws_iam @aws_cognito_user_pools {
  success: Boolean!
  message: String
  mealPlanId: ID!
}

type MealPlanResponseSubscription @aws_iam @aws_cognito_user_pools {
  success: Boolean!
  message: String
  mealPlanId: ID!
  userId: ID!
}

input MealPlanResponseInput {
  success: Boolean!
  message: String
  mealPlanId: ID!
  userId: ID!
}

enum MealPlanValidationStatus {
  NOT_VALIDATED
  VALIDATED
  PENDING_REVIEW
}

type MealWithStatus {
  meal: Meal!
  isCompleted: Boolean!
}

input ModifyAssignedMealPlanInput {
  planName: String
  dailyPlan: DailyPlanDataInput
}

type NutritionistProfile @model {
  id: ID!
  nutritionistId: ID!
  givenName: String
  familyName: String
  # email: AWSEmail # Consider privacy if showing email directly to users
  specialization: String
  bio: String
  profilePictureUrl: String
  # Nullable, TODO: revert to AWSURL
  isAvailable: Boolean
}

type NutritionistProfileConnection {
  items: [NutritionistProfile!]!
  nextToken: String
}

type PlanDayCompletion @model {
  # If using Amplify @model, ensure it maps to the correct DDB keys
  userId: ID!
  # Matches user, for authorization and potential PK
  planId: ID!
  # Identifies the meal plan
  date: AWSDate!
  # The specific date of completion
  completedMealNames: [MealNameEnum!]!
  # List of completed meal names
  updatedAt: AWSDateTime!
}

type PlanRequestPreferences {
  # Include fields from UserDetails that can be overridden for this specific plan request
  weightKg: Float!
  heightCm: Float!
  dateOfBirth: AWSDate!
  gender: String!
  language: String!
  exerciseFrequency: ExerciseFrequency!
  dailyMealsPreference: Int
  allergies: [AllergenEnum!]
  dietaryRestrictions: String
  openTextPreferences: String
}

input PlanRequestPreferencesInput {
  # Include fields from UserDetails that can be overridden for this specific plan request
  weightKg: Float
  heightCm: Float
  language: String
  exerciseFrequency: ExerciseFrequency
  dailyMealsPreference: Int
  allergies: [AllergenEnum!]
  dietaryRestrictions: String
  openTextPreferences: String
}

enum PlanStatus {
  PENDING
  IN_PROGRESS
  GENERATED
  ACTIVE
  ARCHIVED
  FAILED
}

input RequestValidationInput {
  mealPlanId: ID!
  nutritionistId: ID!
}

input SendMessageInput {
  chatId: ID!
  # The ID of the chat session
  messageContent: String!
}

enum SenderType {
  USER
  NUTRITIONIST
}

input SetPlanDayCompletionInput {
  planId: ID!
  date: AWSDate!
  completedMealNames: [MealNameEnum!]!
}

enum SubscriptionStatusEnum {
  FREE
  PRO
}

type TodaysPlan {
  activePlanDetails: MealPlan
  mealsForToday: [MealWithStatus!]
  todaysCompletion: PlanDayCompletion
}

input UnmarkMealCompletedInput {
  mealPlanId: ID!
  mealName: MealNameEnum!
  date: AWSDate
}

input UpdateNutritionistProfileInput {
  specialization: String
  bio: String
  profilePictureUrl: String
  isAvailable: Boolean
}

input UpdateUserDetailsInput {
  weightKg: Float
  heightCm: Float
  exerciseFrequency: ExerciseFrequency
  dailyMealsPreference: Int
  allergies: [AllergenEnum!]
  dietaryRestrictions: String
  openTextPreferences: String
}

type UserDetails @model {
  # Attributes stored in DynamoDB UserDetails item
  userId: ID! @primaryKey
  # Typically the Cognito Sub
  weightKg: Float!
  heightCm: Float!
  exerciseFrequency: ExerciseFrequency!
  dailyMealsPreference: Int!
  allergies: [AllergenEnum!]
  dietaryRestrictions: String
  openTextPreferences: String
  activeMealPlanId: ID
  # ID of the currently active MealPlan
  updatedAt: AWSDateTime
  # Timestamp of the last update for this record
  createdAt: AWSDateTime
}

type UserSubscriptionStatus {
  userId: ID!
  subscriptionStatus: SubscriptionStatusEnum!
}

input ValidateMealPlanInput {
  mealPlanId: ID!
  validationStatus: MealPlanValidationStatus!
}

enum WeekdayEnum {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

# ===================
#      MUTATIONS
# ===================
type Mutation {
  assignNutritionistToPlan(input: AssignNutritionistInput!): MealPlan
    @aws_auth(cognito_groups: ["USERS"])
  requestValidation(input: RequestValidationInput!): MealPlanResponse
    @aws_auth(cognito_groups: ["USERS"])
  updateMyNutritionistProfile(
    input: UpdateNutritionistProfileInput!
  ): NutritionistProfile @aws_auth(cognito_groups: ["NUTRITIONISTS"])
  createMealPlan(input: CreateMealPlanInput!): MealPlanResponse
    @aws_auth(cognito_groups: ["USERS"])
  deleteMealPlan(mealPlanId: ID!): MealPlanResponse
    @aws_auth(cognito_groups: ["USERS", "NUTRITIONISTS"])
  modifyMealPlan(mealPlanId: ID!, mealPlanName: String): MealPlanResponse
    @aws_auth(cognito_groups: ["USERS"])
  modifyAssignedMealPlan(
    mealPlanId: ID!
    userId: ID!
    input: ModifyAssignedMealPlanInput!
  ): MealPlanResponse @aws_auth(cognito_groups: ["NUTRITIONISTS"])
  getMealPlanById(mealPlanId: ID!): MealPlan
    @aws_auth(cognito_groups: ["USERS", "NUTRITIONISTS"])
  markMealAsCompleted(input: MarkMealCompletedInput!): PlanDayCompletion
    @aws_auth(cognito_groups: ["USERS"])
  requestNewMealPlan(
    prefsOverride: PlanRequestPreferencesInput
  ): MealPlanResponse @aws_auth(cognito_groups: ["USERS"])
  sendChatMessage(input: SendMessageInput!): ChatResponse
    @aws_auth(cognito_groups: ["USERS", "NUTRITIONISTS"])
  setActiveMealPlan(mealPlanId: ID!): MealPlanResponse
    @aws_auth(cognito_groups: ["USERS"])
  setPlanDayCompletion(input: SetPlanDayCompletionInput!): PlanDayCompletion
    @aws_auth(cognito_groups: ["USERS"])
  unmarkMealAsCompleted(input: UnmarkMealCompletedInput!): PlanDayCompletion
    @aws_auth(cognito_groups: ["USERS"])
  updateUserDetails(input: UpdateUserDetailsInput!): UserDetails
    @aws_auth(cognito_groups: ["USERS"])
  validateMealPlan(input: ValidateMealPlanInput!): MealPlanResponse
    @aws_auth(cognito_groups: ["NUTRITIONISTS"])
  notifyMealPlanStatusChanged(
    input: MealPlanResponseInput!
  ): MealPlanResponseSubscription @aws_iam
  setUserSubscriptionStatus(
    subscriptionStatus: SubscriptionStatusEnum!
  ): UserSubscriptionStatus @aws_auth(cognito_groups: ["USERS"])
}

# ===================
#       QUERIES
# ===================
type Query {
  getMealPlanById(mealPlanId: ID!): MealPlan
    @aws_auth(cognito_groups: ["USERS"])
  getPlanDayCompletion(planId: ID!, date: AWSDate!): PlanDayCompletion
    @aws_auth(cognito_groups: ["USERS"])
  getTodaysPlanAndStatus: TodaysPlan @aws_auth(cognito_groups: ["USERS"])
  getUserDetails: UserDetails @aws_auth(cognito_groups: ["USERS"])
  getClientDetails(userId: ID!): UserDetails
    @aws_auth(cognito_groups: ["NUTRITIONISTS"])
  getMyNutritionistProfile: NutritionistProfile
    @aws_auth(cognito_groups: ["NUTRITIONISTS"])
  listMyAssignedChats(limit: Int, nextToken: String): ChatMetadataConnection
    @aws_auth(cognito_groups: ["NUTRITIONISTS"])
  listMyChats(limit: Int, nextToken: String): ChatMetadataConnection
    @aws_auth(cognito_groups: ["USERS"])
  listMyMealPlans(limit: Int, nextToken: String): MealPlanList
    @aws_auth(cognito_groups: ["USERS"])
  listNutritionists(
    filter: ListNutritionistsFilter
    limit: Int
    nextToken: String
  ): NutritionistProfileConnection @aws_auth(cognito_groups: ["USERS"])
  getActiveMealPlan: MealPlan @aws_auth(cognito_groups: ["USERS"])
  listMyAssignedMealPlans(limit: Int, nextToken: String): MealPlanList
    @aws_auth(cognito_groups: ["NUTRITIONISTS"])
  getUserSubscriptionStatus: UserSubscriptionStatus
    @aws_auth(cognito_groups: ["USERS"])

  getChatMessages(
    chatId: ID!
    limit: Int = 20
    beforeTimestamp: String # Only for loading older messages
  ): ChatMessagesResponse @aws_auth(cognito_groups: ["NUTRITIONISTS", "USERS"])
}

# ---------------------------------------------------
# 4. REQUIRED SUBSCRIPTION
# How the Flutter app listens for the final result.
# ---------------------------------------------------
type Subscription {
  onMealPlanStatusChanged(userId: ID!): MealPlanResponseSubscription
    @aws_subscribe(mutations: ["notifyMealPlanStatusChanged"])
    @aws_auth(cognito_groups: ["USERS"])
  onNewChatMessageForUser(recipientId: ID!): ChatResponse
    @aws_subscribe(mutations: ["sendChatMessage"])
    @aws_auth(cognito_groups: ["USERS", "NUTRITIONISTS"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
