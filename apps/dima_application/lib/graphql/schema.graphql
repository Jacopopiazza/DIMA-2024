schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type ChatMessage @model {
  chatId: ID!
  messageContent: String!
  messageId: ID!
  #  Populated from Cognito
  recipientId: ID!
  senderId: ID!
  #  Add these for better UX in the subscription
  senderName: String
  senderType: SenderType!
  sentAt: AWSDateTime!
}

type ChatMessageConnection {
  items: [ChatMessage!]!
  nextToken: String
}

type ChatMessagesResponse {
  count: Int!
  #  Use this for next beforeTimestamp
  hasMore: Boolean!
  messages: [ChatMessage!]!
  oldestTimestamp: String
}

type ChatMetadata @model {
  chatId: ID!
  createdAt: AWSDateTime
  lastMessageSnippet: String
  #  Denormalized for display
  lastMessageTimestamp: AWSDateTime
  mealPlanId: ID!
  #  Denormalized for display
  nutritionistGivenName: String
  nutritionistId: ID!
  nutritionistUnreadCount: Int
  planName: String
  #  Denormalized for easier display in chat lists
  userGivenName: String
  userId: ID!
  userUnreadCount: Int
}

type ChatMetadataConnection {
  items: [ChatMetadata!]!
  nextToken: String
}

#  ===================
#     OBJECT TYPES
# ===================
type ChatResponse {
  message: ChatMessage
  recipientId: ID!
}

type DailyPlanData {
  friday: [Meal!]
  monday: [Meal!]
  saturday: [Meal!]
  sunday: [Meal!]
  thursday: [Meal!]
  tuesday: [Meal!]
  wednesday: [Meal!]
}

type Ingredient {
  amount: Float!
  #  e.g., "g", "ml", "cup". Ensure this is stored in DynamoDB.
  macros: Macros!
  name: String!
  unit: String
}

type Macros {
  calories: Float!
  carbohydrates: Float!
  fats: Float!
  proteins: Float!
}

type Meal {
  #  Optional: A more descriptive name for the specific recipe used
  ingredients: [Ingredient!]!
  name: MealNameEnum!
  recipe: String
  #  Using the fixed enum based on i18n requirement
  recipeName: String
  totalMacros: Macros!
}

type MealPlan @model {
  assignedNutritionistId: ID
  chatId: ID
  dailyPlan: DailyPlanData
  generatedAt: AWSDateTime
  mealPlanId: ID!
  #  From PK
  planName: String
  status: PlanStatus
  #  Extracted from SK
  userId: ID!
  validationStatus: MealPlanValidationStatus
}

#   Pagination Helper Types
type MealPlanConnection {
  activeMealPlan: MealPlan
  items: [MealPlan!]!
  nextToken: String
}

type MealPlanGenerationStatus {
  mealPlanId: ID
  #  Populated if status is COMPLETED
  message: String
  status: MealPlanGenerationStatusValue!
}

type MealPlanList {
  activeMealPlan: ID
  items: [MealPlan!]!
  nextToken: String
}

type MealPlanResponse @aws_cognito_user_pools @aws_iam {
  mealPlanId: ID!
  message: String
  success: Boolean!
}

type MealPlanResponseSubscription @aws_cognito_user_pools @aws_iam {
  mealPlanId: ID!
  message: String
  success: Boolean!
  userId: ID!
}

type MealWithStatus {
  isCompleted: Boolean!
  meal: Meal!
}

#  ===================
#      MUTATIONS
# ===================
type Mutation {
  assignNutritionistToPlan(input: AssignNutritionistInput!): MealPlan @aws_auth(cognito_groups : ["USERS"])
  createMealPlan(input: CreateMealPlanInput!): MealPlanResponse @aws_auth(cognito_groups : ["USERS"])
  deleteMealPlan(mealPlanId: ID!): MealPlanResponse @aws_auth(cognito_groups : ["USERS", "NUTRITIONISTS"])
  getMealPlanById(mealPlanId: ID!): MealPlan @aws_auth(cognito_groups : ["USERS", "NUTRITIONISTS"])
  markMealAsCompleted(input: MarkMealCompletedInput!): PlanDayCompletion @aws_auth(cognito_groups : ["USERS"])
  modifyAssignedMealPlan(input: ModifyAssignedMealPlanInput!, mealPlanId: ID!, userId: ID!): MealPlanResponse @aws_auth(cognito_groups : ["NUTRITIONISTS"])
  modifyMealPlan(mealPlanId: ID!, mealPlanName: String): MealPlanResponse @aws_auth(cognito_groups : ["USERS"])
  notifyMealPlanStatusChanged(input: MealPlanResponseInput!): MealPlanResponseSubscription @aws_iam
  requestNewMealPlan(prefsOverride: PlanRequestPreferencesInput): MealPlanResponse @aws_auth(cognito_groups : ["USERS"])
  requestValidation(input: RequestValidationInput!): MealPlanResponse @aws_auth(cognito_groups : ["USERS"])
  sendChatMessage(input: SendMessageInput!): ChatResponse @aws_auth(cognito_groups : ["USERS", "NUTRITIONISTS"])
  setActiveMealPlan(mealPlanId: ID!): MealPlanResponse @aws_auth(cognito_groups : ["USERS"])
  setPlanDayCompletion(input: SetPlanDayCompletionInput!): PlanDayCompletion @aws_auth(cognito_groups : ["USERS"])
  setUserSubscriptionStatus(subscriptionStatus: SubscriptionStatusEnum!): UserSubscriptionStatus @aws_auth(cognito_groups : ["USERS"])
  unmarkMealAsCompleted(input: UnmarkMealCompletedInput!): PlanDayCompletion @aws_auth(cognito_groups : ["USERS"])
  updateMyNutritionistProfile(input: UpdateNutritionistProfileInput!): NutritionistProfile @aws_auth(cognito_groups : ["NUTRITIONISTS"])
  updateUserDetails(input: UpdateUserDetailsInput!): UserDetails @aws_auth(cognito_groups : ["USERS"])
  validateMealPlan(input: ValidateMealPlanInput!): MealPlanResponse @aws_auth(cognito_groups : ["NUTRITIONISTS"])
}

type NutritionistProfile @model {
  bio: String
  familyName: String
  givenName: String
  id: ID!
  #  Nullable, TODO: revert to AWSURL
  isAvailable: Boolean
  nutritionistId: ID!
  profilePictureUrl: String
  #  email: AWSEmail # Consider privacy if showing email directly to users
  specialization: String
}

type NutritionistProfileConnection {
  items: [NutritionistProfile!]!
  nextToken: String
}

type PlanDayCompletion @model {
  #  The specific date of completion
  completedMealNames: [MealNameEnum!]!
  #  Identifies the meal plan
  date: AWSDate!
  #  Matches user, for authorization and potential PK
  planId: ID!
  #  List of completed meal names
  updatedAt: AWSDateTime!
  #  If using Amplify @model, ensure it maps to the correct DDB keys
  userId: ID!
}

type PlanRequestPreferences {
  allergies: [AllergenEnum!]
  dailyMealsPreference: Int
  dateOfBirth: AWSDate!
  dietaryRestrictions: String
  exerciseFrequency: ExerciseFrequency!
  gender: String!
  heightCm: Float!
  language: String!
  openTextPreferences: String
  #  Include fields from UserDetails that can be overridden for this specific plan request
  weightKg: Float!
}

#  ===================
#       QUERIES
# ===================
type Query {
  getActiveMealPlan: MealPlan @aws_auth(cognito_groups : ["USERS"])
  getChatMessages(beforeTimestamp: String, chatId: ID!, limit: Int): ChatMessagesResponse @aws_auth(cognito_groups : ["NUTRITIONISTS", "USERS"])
  getClientDetails(userId: ID!): UserDetails @aws_auth(cognito_groups : ["NUTRITIONISTS"])
  getMealPlanById(mealPlanId: ID!): MealPlan @aws_auth(cognito_groups : ["USERS"])
  getMyNutritionistProfile: NutritionistProfile @aws_auth(cognito_groups : ["NUTRITIONISTS"])
  getPlanDayCompletion(date: AWSDate!, planId: ID!): PlanDayCompletion @aws_auth(cognito_groups : ["USERS"])
  getTodaysPlanAndStatus: TodaysPlan @aws_auth(cognito_groups : ["USERS"])
  getUserDetails: UserDetails @aws_auth(cognito_groups : ["USERS"])
  getUserSubscriptionStatus: UserSubscriptionStatus @aws_auth(cognito_groups : ["USERS"])
  listMyAssignedChats(limit: Int, nextToken: String): ChatMetadataConnection @aws_auth(cognito_groups : ["NUTRITIONISTS"])
  listMyAssignedMealPlans(limit: Int, nextToken: String): MealPlanList @aws_auth(cognito_groups : ["NUTRITIONISTS"])
  listMyChats(limit: Int, nextToken: String): ChatMetadataConnection @aws_auth(cognito_groups : ["USERS"])
  listMyMealPlans(limit: Int, nextToken: String): MealPlanList @aws_auth(cognito_groups : ["USERS"])
  listNutritionists(filter: ListNutritionistsFilter, limit: Int, nextToken: String): NutritionistProfileConnection @aws_auth(cognito_groups : ["USERS"])
}

#  ---------------------------------------------------
# 4. REQUIRED SUBSCRIPTION
# How the Flutter app listens for the final result.
# ---------------------------------------------------
type Subscription {
  onMealPlanStatusChanged(userId: ID!): MealPlanResponseSubscription @aws_auth(cognito_groups : ["USERS"]) @aws_subscribe(mutations : ["notifyMealPlanStatusChanged"])
  onNewChatMessageForUser(recipientId: ID!): ChatResponse @aws_auth(cognito_groups : ["USERS", "NUTRITIONISTS"]) @aws_subscribe(mutations : ["sendChatMessage"])
}

type TodaysPlan {
  activePlanDetails: MealPlan
  mealsForToday: [MealWithStatus!]
  todaysCompletion: PlanDayCompletion
}

type UserDetails @model {
  activeMealPlanId: ID
  allergies: [AllergenEnum!]
  #  Timestamp of the last update for this record
  createdAt: AWSDateTime
  dailyMealsPreference: Int!
  dietaryRestrictions: String
  exerciseFrequency: ExerciseFrequency!
  heightCm: Float!
  openTextPreferences: String
  #  ID of the currently active MealPlan
  updatedAt: AWSDateTime
  #  Attributes stored in DynamoDB UserDetails item
  userId: ID! @primaryKey
  #  Typically the Cognito Sub
  weightKg: Float!
}

type UserSubscriptionStatus {
  subscriptionStatus: SubscriptionStatusEnum!
  userId: ID!
}

#  For flexible preferences or potentially the DailyPlan if needed, though Map is preferred
# ===================
#        ENUMS
# ===================
enum AllergenEnum {
  CELERY
  CRUSTACEANS
  EGGS
  FISH
  GLUTEN_CEREALS
  LUPIN
  MILK
  MOLLUSCS
  MUSTARD
  NUTS
  PEANUTS
  SESAME_SEEDS
  SOYBEANS
  SULPHITES
}

enum ExerciseFrequency {
  EVERY_DAY
  FIVE_TIMES_A_WEEK
  FOUR_TIMES_A_WEEK
  NONE
  NOT_SPECIFIED
  ONCE_A_WEEK
  SIX_TIMES_A_WEEK
  THREE_TIMES_A_WEEK
  TWICE_A_WEEK
}

enum MealNameEnum {
  BREAKFAST
  DINNER
  LUNCH
  SNACK_AFTERNOON
  SNACK_EVENING
  SNACK_MORNING
}

enum MealPlanGenerationStatusValue {
  COMPLETED
  FAILED
  IN_PROGRESS
  PENDING
}

enum MealPlanValidationStatus {
  NOT_VALIDATED
  PENDING_REVIEW
  REJECTED
  VALIDATED
}

enum PlanStatus {
  ACTIVE
  ARCHIVED
  FAILED
  GENERATED
  IN_PROGRESS
  PENDING
}

enum SenderType {
  NUTRITIONIST
  USER
}

enum SubscriptionStatusEnum {
  FREE
  PRO
}

enum WeekdayEnum {
  FRIDAY
  MONDAY
  SATURDAY
  SUNDAY
  THURSDAY
  TUESDAY
  WEDNESDAY
}

#  ===================
#     INPUT TYPES
# ===================
input AssignNutritionistInput {
  mealPlanId: ID!
  nutritionistId: ID!
}

input CreateMealPlanInput {
  dailyPlan: DailyPlanDataInput!
  endDate: AWSDate!
  planName: String!
  startDate: AWSDate!
  status: PlanStatus
}

input DailyPlanDataInput {
  friday: [MealInput!]
  monday: [MealInput!]
  saturday: [MealInput!]
  sunday: [MealInput!]
  thursday: [MealInput!]
  tuesday: [MealInput!]
  wednesday: [MealInput!]
}

input IngredientInput {
  amount: Float!
  macros: MacrosInput!
  name: String!
  unit: String
}

input ListNutritionistsFilter {
  isAvailable: Boolean
}

input MacrosInput {
  calories: Float!
  carbohydrates: Float!
  fats: Float!
  proteins: Float!
}

input MarkMealCompletedInput {
  date: AWSDate
  mealName: MealNameEnum!
  mealPlanId: ID!
}

input MealInput {
  ingredients: [IngredientInput!]!
  name: MealNameEnum!
  recipe: String
  recipeName: String
  totalMacros: MacrosInput!
}

input MealPlanResponseInput {
  mealPlanId: ID!
  message: String
  success: Boolean!
  userId: ID!
}

input ModifyAssignedMealPlanInput {
  dailyPlan: DailyPlanDataInput
  planName: String
}

input PlanRequestPreferencesInput {
  allergies: [AllergenEnum!]
  dailyMealsPreference: Int
  dietaryRestrictions: String
  exerciseFrequency: ExerciseFrequency
  heightCm: Float
  language: String
  openTextPreferences: String
  #  Include fields from UserDetails that can be overridden for this specific plan request
  weightKg: Float
}

input RequestValidationInput {
  mealPlanId: ID!
  nutritionistId: ID!
}

input SendMessageInput {
  chatId: ID!
  #  The ID of the chat session
  messageContent: String!
}

input SetPlanDayCompletionInput {
  completedMealNames: [MealNameEnum!]!
  date: AWSDate!
  planId: ID!
}

input UnmarkMealCompletedInput {
  date: AWSDate
  mealName: MealNameEnum!
  mealPlanId: ID!
}

input UpdateNutritionistProfileInput {
  bio: String
  isAvailable: Boolean
  profilePictureUrl: String
  specialization: String
}

input UpdateUserDetailsInput {
  allergies: [AllergenEnum!]
  dailyMealsPreference: Int
  dietaryRestrictions: String
  exerciseFrequency: ExerciseFrequency
  heightCm: Float
  openTextPreferences: String
  weightKg: Float
}

input ValidateMealPlanInput {
  mealPlanId: ID!
  validationStatus: MealPlanValidationStatus!
}
