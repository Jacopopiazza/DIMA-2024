schema {
  query: Query
  mutation: Mutation
}

type ChatMessage @model {
  chatId: ID!
  messageContent: String!
  #  From PK
  messageId: ID!
  #  From SK (e.g., MSG#timestamp)
  senderId: ID!
  senderType: SenderType!
  sentAt: AWSDateTime!
}

type ChatMessageConnection {
  items: [ChatMessage!]!
  nextToken: String
}

type ChatMetadata @model {
  chatId: ID!
  createdAt: AWSDateTime
  lastMessageSnippet: String
  #  Denormalized for display
  lastMessageTimestamp: AWSDateTime
  mealPlanId: ID!
  #  Denormalized for display
  nutritionistGivenName: String
  nutritionistId: ID!
  nutritionistUnreadCount: Int
  planName: String
  #  Denormalized for easier display in chat lists
  userGivenName: String
  userId: ID!
  userUnreadCount: Int
}

type ChatMetadataConnection {
  items: [ChatMetadata!]!
  nextToken: String
}

type CompletedMealLog @model {
  #  From SK (extracted date part)
  completedMealKeys: [String!]
  #  From PK
  date: AWSDate!
  userId: ID!
}

type DailyPlanData {
  friday: [Meal!]
  monday: [Meal!]
  saturday: [Meal!]
  sunday: [Meal!]
  thursday: [Meal!]
  tuesday: [Meal!]
  wednesday: [Meal!]
}

type Ingredient {
  amount: Float!
  #  e.g., "g", "ml", "cup". Ensure this is stored in DynamoDB.
  macros: Macros!
  name: String!
  unit: String
}

type Macros {
  calories: Float!
  carbohydrates: Float!
  fats: Float!
  proteins: Float!
}

type Meal {
  #  Optional: A more descriptive name for the specific recipe used
  ingredients: [Ingredient!]!
  name: MealNameEnum!
  recipe: String
  #  Using the fixed enum based on i18n requirement
  recipeName: String
  totalMacros: Macros!
}

type MealPlan @model {
  assignedNutritionistId: ID
  chatId: ID
  dailyPlan: DailyPlanData
  endDate: AWSDate
  generatedAt: AWSDateTime
  mealPlanId: ID!
  #  From PK
  planName: String
  startDate: AWSDate
  status: PlanStatus
  #  Extracted from SK
  userId: ID!
}

#  Pagination Helper Types
type MealPlanConnection {
  items: [MealPlan!]!
  nextToken: String
}

type MealPlanGenerationStatus {
  mealPlanId: ID
  #  Populated if status is COMPLETED
  message: String
  status: MealPlanGenerationStatusValue!
}

type MealWithStatus {
  isCompleted: Boolean!
  meal: Meal!
}

#  ===================
#      MUTATIONS
# ===================
type Mutation {
  assignNutritionistToPlan(input: AssignNutritionistInput!): MealPlan @aws_auth(cognito_groups : ["USERS"])
  markMealAsCompleted(input: MarkMealCompletedInput!): CompletedMealLog @aws_auth(cognito_groups : ["USERS"])
  requestNewMealPlan(prefsOverride: PlanRequestPreferencesInput): MealPlanGenerationStatus @aws_auth(cognito_groups : ["USERS"])
  #  Add Pro group check in resolver?
  sendChatMessage(input: SendMessageInput!): ChatMessage @aws_auth(cognito_groups : ["USERS", "NUTRITIONISTS"])
  setActiveMealPlan(mealPlanId: ID!): UserDetails @aws_auth(cognito_groups : ["USERS"])
  unmarkMealAsCompleted(input: UnmarkMealCompletedInput!): CompletedMealLog @aws_auth(cognito_groups : ["USERS"])
  updateMyUserDetails(input: UpdateUserDetailsInput!): UserDetails @aws_auth(cognito_groups : ["USERS"])
}

type NutritionistProfile @model {
  bio: String
  familyName: String
  givenName: String
  isAvailable: Boolean
  nutritionistId: ID!
  profilePictureUrl: AWSURL
  #  email: AWSEmail # Consider privacy if showing email directly to users
  specialization: String
}

type NutritionistProfileConnection {
  items: [NutritionistProfile!]!
  nextToken: String
}

#  ===================
#       QUERIES
# ===================
type Query {
  #  Add Pro group check in resolver?
  getChatMessages(chatId: ID!, limit: Int, nextToken: String): ChatMessageConnection @aws_auth(cognito_groups : ["USERS", "NUTRITIONISTS"])
  #  Requires complex/pipeline resolver
  getCompletedMealsForDate(date: AWSDate!): CompletedMealLog @aws_auth(cognito_groups : ["USERS"])
  getMealPlanById(mealPlanId: ID!): MealPlan @aws_auth(cognito_groups : ["USERS"])
  getMyUserDetails: UserDetails @aws_auth(cognito_groups : ["USERS", "NUTRITIONISTS"])
  getTodaysPlanAndStatus: TodaysPlan @aws_auth(cognito_groups : ["USERS"])
  listMyAssignedChats(limit: Int, nextToken: String): ChatMetadataConnection @aws_auth(cognito_groups : ["NUTRITIONISTS"])
  #  Add Pro group check in resolver?
  listMyChats(limit: Int, nextToken: String): ChatMetadataConnection @aws_auth(cognito_groups : ["USERS"])
  #  Adjust auth as needed
  listMyMealPlans(limit: Int, nextToken: String): MealPlanConnection @aws_auth(cognito_groups : ["USERS"])
  listNutritionists(filter: ListNutritionistsFilter, limit: Int, nextToken: String): NutritionistProfileConnection @aws_auth(cognito_groups : ["USERS"])
}

type TodaysPlan {
  activePlanDetails: MealPlan
  #  Full details of the active plan
  mealsForToday: [MealWithStatus!]
}

#  ===================
#     OBJECT TYPES
# ===================
type UserDetails @model {
  activeMealPlanId: ID
  allergies: [AllergenEnum!]
  dailyMealsPreference: Int
  dietaryRestrictions: [String!]
  exerciseFrequency: ExerciseFrequency
  heightCm: Float
  openTextPreferences: String
  targetCalories: Float
  #  ID of the currently active MealPlan
  updatedAt: AWSDateTime
  #  Attributes stored in DynamoDB UserDetails item
  userId: ID!
  #  Typically the Cognito Sub
  weightKg: Float
}

enum AllergenEnum {
  CELERY
  CRUSTACEANS
  EGGS
  FISH
  GLUTEN_CEREALS
  LUPIN
  MILK
  MOLLUSCS
  MUSTARD
  NUTS
  PEANUTS
  SESAME_SEEDS
  SOYBEANS
  SULPHITES
}

#  For flexible preferences or potentially the DailyPlan if needed, though Map is preferred
# ===================
#        ENUMS
# ===================
enum ExerciseFrequency {
  EVERY_DAY
  FIVE_TIMES_A_WEEK
  FOUR_TIMES_A_WEEK
  NONE
  NOT_SPECIFIED
  ONCE_A_WEEK
  Or
  SIX_TIMES_A_WEEK
  THREE_TIMES_A_WEEK
  TWICE_A_WEEK
}

enum MealNameEnum {
  BREAKFAST
  DINNER
  LUNCH
  SNACK_AFTERNOON
  SNACK_EVENING
  SNACK_MORNING
}

enum MealPlanGenerationStatusValue {
  COMPLETED
  FAILED
  IN_PROGRESS
  PENDING
}

enum PlanStatus {
  ACTIVE
  ARCHIVED
  GENERATED
  REVIEW_REQUESTED
  UNDER_REVIEW
}

enum SenderType {
  NUTRITIONIST
  USER
}

enum WeekdayEnum {
  FRIDAY
  MONDAY
  SATURDAY
  SUNDAY
  THURSDAY
  TUESDAY
  WEDNESDAY
}

input AssignNutritionistInput {
  mealPlanId: ID!
  nutritionistId: ID!
}

input ListNutritionistsFilter {
  isAvailable: Boolean
}

input MarkMealCompletedInput {
  #  Need to know which plan it belongs to
  # dayOfWeek: WeekdayEnum! # Server can derive from 'today'
  mealName: MealNameEnum!
  #  date: AWSDate! # Date is implicitly 'today' for this mutation's logic
  mealPlanId: ID!
}

input PlanRequestPreferencesInput {
  allergies: [AllergenEnum!]
  dailyMealsPreference: Int
  dietaryRestrictions: [String!]
  exerciseFrequency: ExerciseFrequency
  heightCm: Float
  openTextPreferences: String
  targetCalories: Float
  #  Include fields from UserDetails that can be overridden for this specific plan request
  weightKg: Float
}

input SendMessageInput {
  chatId: ID!
  #  The ID of the chat session
  messageContent: String!
}

input UnmarkMealCompletedInput {
  mealName: MealNameEnum!
  mealPlanId: ID!
}

#  ===================
#     INPUT TYPES
# ===================
input UpdateUserDetailsInput {
  allergies: [AllergenEnum!]
  dailyMealsPreference: Int
  dietaryRestrictions: [String!]
  exerciseFrequency: ExerciseFrequency
  heightCm: Float
  openTextPreferences: String
  targetCalories: Float
  weightKg: Float
}
